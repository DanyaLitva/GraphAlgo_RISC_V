name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make
    - name: run scal mxm test mca
      run: ./build/grAlgo ./graphs/G43.mtx log.txt launch mxm par scal mca && ./build/grAlgo ./graphs/G43.mtx log.txt launch mxm par vec mca
    - name: run scal mxm test mca
      run: ./build/grAlgo ./graphs/G43.mtx log.txt launch mxm par scal msa && ./build/grAlgo ./graphs/G43.mtx log.txt launch mxm par vec msa
